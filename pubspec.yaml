name: swithfiber_tech
description: "Native mobile application for Switch Fiber Field Technicians."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  # Icons & Styling
  cupertino_icons: ^1.0.8
  intl: ^0.20.2

  # State Management
  signals_flutter: ^7.1.0

  # Local Database (Drift SQLite)
  drift: ^2.24.2
  sqlite3_flutter_libs: ^0.6.0+eol
  path_provider: ^2.1.5
  path: ^1.9.0

  # Networking & Secure Storage
  dio: ^5.8.0+1
  crypto: ^3.0.7
  flutter_secure_storage: ^11.0.0
  uuid: ^4.5.1
  flutter_map: ^8.3.1
  latlong2: ^0.10.1
  flutter_map_cache: ^2.1.0
  http_cache_drift_store: ^7.0.1
  url_launcher: ^6.3.2
  image_picker: ^1.2.3
  geolocator: ^14.0.3
  exif: ^3.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.24.2
  build_runner: ^2.4.15
  flutter_launcher_icons: ^0.14.4

# App icons. Android already ships a hand-made adaptive icon under
# android/app/src/main/res, so only the iOS set is generated here, from the
# same logo, with the alpha channel flattened onto white as App Store Connect
# requires. Regenerate with: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: false
  ios: true
  image_path: "assets/images/logo.png"
  remove_alpha_ios: true
  background_color_ios: "#FFFFFF"

flutter:
  uses-material-design: true

  assets:
    - assets/images/
