name: swithfiber_tech
description: "Native mobile application for Switch Fiber Field Technicians."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  # Icons & Styling
  cupertino_icons: ^1.0.8
  intl: ^0.20.2

  # State Management
  signals_flutter: ^7.1.0

  # Local Database (Drift SQLite)
  drift: ^2.24.2
  sqlite3_flutter_libs: ^0.6.0+eol
  path_provider: ^2.1.5
  path: ^1.9.0

  # Networking & Secure Storage
  dio: ^5.8.0+1
  crypto: ^3.0.7
  flutter_secure_storage: ^11.0.0
  uuid: ^4.5.1
  flutter_map: ^8.3.1
  latlong2: ^0.10.1
  flutter_map_cache: ^2.1.0
  http_cache_drift_store: ^7.0.1
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.24.2
  build_runner: ^2.4.15

flutter:
  uses-material-design: true

  assets:
    - assets/images/
